name: Weekly Supabase backup (encrypted)

# Sauvegarde hebdomadaire de la base Supabase, chiffrée GPG, déposée dans le
# dépôt privé FridgePlus-prive (branche `sauvegardes`) par une clé de déploiement.
#
# Pourquoi depuis le dépôt public ? Les Actions y sont gratuites ; le dépôt privé
# épuise son quota et son job ne démarre plus. Le dump ne devient jamais un
# artifact ici : l'artifact d'un dépôt public se télécharge par n'importe qui,
# même chiffré. Seul le fichier chiffré transite, vers le dépôt privé.
#
# Secrets requis (Settings → Secrets and variables → Actions, dépôt FridgePlus) :
#   • SUPABASE_DB_URL        — chaîne de connexion PostgreSQL (Supabase → Connect →
#                              URI avec le mot de passe ; le pooler en mode session
#                              convient)
#   • GPG_PUBLIC_KEY         — clé publique GPG du destinataire, ASCII armored
#                              (`gpg --export --armor ton@adresse`)
#   • GPG_RECIPIENT          — l'identité (e-mail) associée à cette clé
#   • SAUVEGARDE_DEPLOY_KEY  — clé privée SSH (ed25519) dont la clé publique est une
#                              « deploy key » EN ÉCRITURE du dépôt FridgePlus-prive
#
# Pour restaurer : voir la procédure interne de sauvegarde (déchiffrer avec la clé
# privée GPG, puis `pg_restore --format=custom`).

on:
  schedule:
    - cron: '0 2 * * 0' # dimanche, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sauvegarde-supabase
  cancel-in-progress: false

env:
  DEPOT_PRIVE: git@github.com:Lisow7/FridgePlus-prive.git
  BRANCHE: sauvegardes
  A_GARDER: 26 # sauvegardes hebdomadaires conservées (six mois)

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install postgresql-client 17 (pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Verify required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_RECIPIENT: ${{ secrets.GPG_RECIPIENT }}
          SAUVEGARDE_DEPLOY_KEY: ${{ secrets.SAUVEGARDE_DEPLOY_KEY }}
        run: |
          [ -n "$SUPABASE_DB_URL" ]       || { echo "❌ SUPABASE_DB_URL manquant";       exit 1; }
          [ -n "$GPG_PUBLIC_KEY" ]        || { echo "❌ GPG_PUBLIC_KEY manquant";        exit 1; }
          [ -n "$GPG_RECIPIENT" ]         || { echo "❌ GPG_RECIPIENT manquant";         exit 1; }
          [ -n "$SAUVEGARDE_DEPLOY_KEY" ] || { echo "❌ SAUVEGARDE_DEPLOY_KEY manquant"; exit 1; }
          echo "✓ Secrets présents"

      - name: Import GPG public key
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_RECIPIENT: ${{ secrets.GPG_RECIPIENT }}
        run: |
          echo "$GPG_PUBLIC_KEY" | gpg --import
          echo -e "5\ny\n" | gpg --command-fd 0 --expert --edit-key "$GPG_RECIPIENT" trust quit || true

      - name: Dump database (compressed)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATE=$(date -u +%Y%m%d_%H%M)
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-acl \
            --schema=public \
            --format=custom \
            --file="fridge-backup-${DATE}.dump"
          echo "BACKUP_FILE=fridge-backup-${DATE}.dump" >> $GITHUB_ENV
          ls -lh fridge-backup-*.dump

      - name: Verify the dump is a real backup
        run: |
          echo "── 1. Le fichier est un dump PostgreSQL lisible"
          /usr/lib/postgresql/17/bin/pg_restore --list "$BACKUP_FILE" > toc.txt
          echo "   $(grep -c 'TABLE DATA' toc.txt) table(s) avec des données"
          echo "── 2. Le socle est présent"
          for table in recipes_unified ingredients; do
            grep -qE "TABLE DATA public ${table} " toc.txt \
              || { echo "❌ La table ${table} n'a AUCUNE donnée dans le dump — ce n'est pas une sauvegarde"; exit 1; }
            echo "   ✓ ${table}"
          done
          echo "── 3. La taille est plausible"
          TAILLE=$(stat -c %s "$BACKUP_FILE")
          PLANCHER=512000
          [ "$TAILLE" -ge "$PLANCHER" ] \
            || { echo "❌ Dump de $((TAILLE/1024)) Ko, sous le plancher de $((PLANCHER/1024)) Ko — tronqué ?"; exit 1; }
          echo "   ✓ $((TAILLE/1024)) Ko"

      - name: Encrypt with GPG
        env:
          GPG_RECIPIENT: ${{ secrets.GPG_RECIPIENT }}
        run: |
          gpg --trust-model always --output "${BACKUP_FILE}.gpg" --encrypt --recipient "$GPG_RECIPIENT" "$BACKUP_FILE"
          shred -u "$BACKUP_FILE"
          ls -lh *.dump.gpg

      - name: Prepare SSH for the private repository
        env:
          SAUVEGARDE_DEPLOY_KEY: ${{ secrets.SAUVEGARDE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SAUVEGARDE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Les empreintes publiées par GitHub, pas un ssh-keyscan (qui croirait n'importe qui).
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # ssh -T rend 1 même quand la clé est acceptée (pas de shell chez GitHub) : on lit le texte.
          REPONSE=$(ssh -T -o BatchMode=yes git@github.com 2>&1 || true)
          echo "$REPONSE" | grep -q "successfully authenticated" \
            || { echo "❌ La clé de déploiement n'ouvre pas GitHub : $REPONSE"; exit 1; }
          echo "✓ Clé de déploiement acceptée"

      - name: Deposit the encrypted backup in the private repository
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "$DEPOT_PRIVE" "$BRANCHE" >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch "$BRANCHE" "$DEPOT_PRIVE" depot
          else
            git init --quiet depot
            git -C depot checkout --quiet --orphan "$BRANCHE"
            git -C depot remote add origin "$DEPOT_PRIVE"
          fi
          cp "${BACKUP_FILE}.gpg" depot/
          cd depot
          git config user.name "Sauvegarde Fridge+"
          git config user.email "sauvegarde@users.noreply.github.com"
          git add "${BACKUP_FILE}.gpg"
          git commit --quiet -m "Sauvegarde chiffrée du $(date -u +%Y-%m-%d) (${BACKUP_FILE}.gpg)"
          git push --quiet origin "HEAD:${BRANCHE}"
          echo "✓ ${BACKUP_FILE}.gpg déposé sur la branche ${BRANCHE} de FridgePlus-prive"

      - name: Keep only the last backups
        run: |
          set -euo pipefail
          cd depot
          # Un dépôt git ne maigrit pas quand on supprime un fichier : la branche est
          # recréée sans histoire avec les A_GARDER derniers fichiers. Un échec ici est
          # toléré, la sauvegarde du jour est déjà poussée.
          mapfile -t fichiers < <(ls -1 fridge-backup-*.dump.gpg | sort)
          n=${#fichiers[@]}
          if [ "$n" -le "$A_GARDER" ]; then
            echo "✓ $n sauvegarde(s) conservée(s), rien à élaguer"
            exit 0
          fi
          for f in "${fichiers[@]:0:$((n - A_GARDER))}"; do rm -f "$f"; done
          git checkout --quiet --orphan elagage
          git add -A
          git commit --quiet -m "Sauvegardes conservées : les $A_GARDER dernières ($(date -u +%Y-%m-%d))"
          if git push --quiet --force origin "HEAD:${BRANCHE}"; then
            echo "✓ Branche ramenée aux $A_GARDER dernières sauvegardes"
          else
            echo "⚠ Élagage non poussé (la sauvegarde du jour l'est)"
          fi

      - name: Summary
        run: |
          echo "## ✅ Sauvegarde déposée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Fichier : \`${BACKUP_FILE}.gpg\` → FridgePlus-prive, branche \`${BRANCHE}\` (les ${A_GARDER} dernières conservées)" >> $GITHUB_STEP_SUMMARY
          echo "Procédure de restauration : la procédure interne de sauvegarde" >> $GITHUB_STEP_SUMMARY
