name: Secret scan

# gitleaks sur chaque PR : bloque l'introduction d'un secret avant merge.
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read   # requis par gitleaks-action v2 pour lister les commits de la PR via l'API

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # GITHUB_TOKEN requis depuis gitleaks-action v2 pour scanner les PR (liste les commits via l'API).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Repo perso/prive : gitleaks-action est gratuit, pas de licence requise.
