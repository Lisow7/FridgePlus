<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page introuvable · Fridge+</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --cream:       #fdf6ec;
      --charcoal:    #2d1b00;
      --muted:       #8d6e63;
      --header-bg:   rgba(253,250,246,0.92);
      --header-bd:   rgba(237,228,212,0.50);
      --shape-color: #C85808;
      --shape-op:    0.09;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cream:       #130A02;
        --charcoal:    #F5ECD8;
        --muted:       #C4A882;
        --header-bg:   rgba(19,10,2,0.92);
        --header-bd:   rgba(60,34,10,0.55);
        --shape-color: #F7A85E;
        --shape-op:    0.14;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--cream);
      color: var(--charcoal);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Fond SVG ── */
    .bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .bg .shape {
      color:   var(--shape-color);
      opacity: var(--shape-op);
    }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 14px 24px;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--header-bd);
      z-index: 10;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      gap: 1px;
    }
    .logo span:first-child { font-size: 20px; font-weight: 700; color: var(--charcoal); }
    .logo span:last-child  { font-size: 20px; font-weight: 700; color: #E07820; }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 48px;
      position: relative;
      z-index: 1;
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    /* ── 404 ── */
    .code {
      font-size: clamp(82px, 20vw, 130px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -6px;
      background: linear-gradient(135deg, #F7A85E 0%, #D46A10 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .tagline  { font-size: 18px; font-weight: 700; color: var(--charcoal); margin-top: 8px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--muted); line-height: 1.7; }

    /* ── Bouton ── */
    .btn {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, #F7A85E 0%, #D46A10 100%);
      color: white;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 18px rgba(212,106,16,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover  { transform: translateY(-1px); box-shadow: 0 6px 26px rgba(212,106,16,0.50); }
    .btn:active { transform: scale(0.97); }

    /* ── Animations frigo — tube néon ── */
    @keyframes neon {
      0%,  6%,  8%,  10%, 12%, 70%, 73%, 76%, 100% { opacity: 1;    }
      7%,  9%,  11%                                 { opacity: 0.04; }
      71%, 74%, 75%                                 { opacity: 0.06; }
      72%                                           { opacity: 0.70; }
    }
    .neon-tube { animation: neon 18s linear infinite; }
    .neon-glow { animation: neon 18s linear infinite; animation-delay: -0.12s; }

    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(-4deg); }
    }
    .sway { transform-origin: 23px 182px; animation: sway 5s ease-in-out infinite; }

    /* ── Frigo : adaptation dark mode (couleurs hardcodées dans le SVG) ── */
    @media (prefers-color-scheme: dark) {
      .fridge-svg { filter: brightness(0.72) saturate(0.80) hue-rotate(-4deg); }
    }
  </style>
</head>
