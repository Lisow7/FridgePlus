<body style="margin:0;padding:0;background-color:#F0E8DC;font-family:'Segoe UI',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F0E8DC;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#FDFAF6;border-radius:16px;overflow:hidden;max-width:480px;width:100%;">
          <tr>
            <td style="padding:32px 32px 8px;text-align:center;">
              <span style="font-size:22px;font-weight:800;color:#2C1A0E;">Fridge<span style="color:#E07820;">+</span></span>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 8px;text-align:center;">
              <span style="font-size:40px;">✉️</span>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px;text-align:center;">
              <h1 style="font-size:20px;font-weight:800;color:#2C1A0E;margin:0 0 12px;">Confirme ton nouvel e-mail</h1>
              <p style="font-size:14px;line-height:1.6;color:#6A4F45;margin:0 0 24px;">
                Tu as demandé à changer l'adresse e-mail de ton compte Fridge+.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px;text-align:center;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:linear-gradient(135deg,#F7A85E,#D46A10);color:#ffffff;font-weight:700;font-size:14px;text-decoration:none;padding:13px 28px;border-radius:10px;">
                Confirmer le changement
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 28px;text-align:center;border-top:1px solid #EDE4D4;padding-top:20px;">
              <p style="font-size:12px;line-height:1.5;color:#9C8C7C;margin:0;">
                Tu n'es pas à l'origine de cette demande ? Ignore cet e-mail.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
